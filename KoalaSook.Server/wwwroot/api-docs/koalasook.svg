<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" width="280" height="72" fill="none">
    <defs>
        <linearGradient id="koala-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00d2ff" />
            <stop offset="100%" stop-color="#0072ff" />
        </linearGradient>
    </defs>
    <!-- Koala Emblem -->
    <g transform="translate(8, 6)">
        <!-- Left Ear -->
        <circle cx="14" cy="18" r="14" fill="url(#koala-grad)" />
        <circle cx="14" cy="18" r="7.5" fill="#18181b" />
        <!-- Right Ear -->
        <circle cx="48" cy="18" r="14" fill="url(#koala-grad)" />
        <circle cx="48" cy="18" r="7.5" fill="#18181b" />
        <!-- Head -->
        <circle cx="31" cy="34" r="23" fill="#18181b" stroke="url(#koala-grad)" stroke-width="3" />
        <!-- Eyes -->
        <circle cx="22" cy="31" r="3" fill="#ffffff" />
        <circle cx="40" cy="31" r="3" fill="#ffffff" />
        <!-- Koala Nose -->
        <ellipse cx="31" cy="39" rx="6.5" ry="9.5" fill="url(#koala-grad)" />
    </g>
    <!-- Brand Name -->
    <text x="82" y="47" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="33" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Koala<tspan fill="#00d2ff">Sook</tspan></text>
</svg>
